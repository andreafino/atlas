<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <style>
      .box-title { font-size: 12.5px; font-weight: 700; fill: #382F2D; }
      .box-sub { font-size: 10.5px; fill: #76696A; }
      .lane-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; fill: #B35A07; }
      .arrow-flow { stroke: #F08019; stroke-width: 2.5; fill: none; stroke-dasharray: 5 8; }
      .arrow-mcp { stroke: #76696A; stroke-width: 1.8; fill: none; stroke-dasharray: 3 5; }
    </style>
    <marker id="arrowAI" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#382F2D" />
    </marker>
    <marker id="arrowMcp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#76696A" />
    </marker>
  </defs>

  <rect width="860" height="300" rx="10" fill="#FBFAF8" />

  <text x="430" y="28" text-anchor="middle" class="box-title">Dalla descrizione al diagramma in Vector</text>

  <!-- Lane 1: file JSON -->
  <text x="20" y="54" class="lane-label">Via file JSON</text>

  <g>
    <rect x="20" y="66" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#E2DCD6">
      <animate attributeName="stroke" values="#E2DCD6;#F08019;#E2DCD6" dur="6s" begin="0s" keyTimes="0;0.08;0.2" repeatCount="indefinite" />
    </rect>
    <text x="95" y="96" text-anchor="middle" class="box-title">AI_DIAGRAM_SCHEMA</text>
    <text x="95" y="114" text-anchor="middle" class="box-sub">schema + descrizione</text>
  </g>

  <path class="arrow-flow" d="M170 102 H230" marker-end="url(#arrowAI)">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1s" repeatCount="indefinite" />
  </path>

  <g>
    <rect x="235" y="66" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#E2DCD6">
      <animate attributeName="stroke" values="#E2DCD6;#F08019;#E2DCD6" dur="6s" begin="1s" keyTimes="0;0.08;0.2" repeatCount="indefinite" />
    </rect>
    <text x="310" y="96" text-anchor="middle" class="box-title">Chat AI</text>
    <text x="310" y="114" text-anchor="middle" class="box-sub">ChatGPT · Gemini · Claude</text>
  </g>

  <path class="arrow-flow" d="M385 102 H445" marker-end="url(#arrowAI)">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1s" begin="0.25s" repeatCount="indefinite" />
  </path>

  <g>
    <rect x="450" y="66" width="130" height="72" rx="8" fill="#FFFFFF" stroke="#E2DCD6">
      <animate attributeName="stroke" values="#E2DCD6;#F08019;#E2DCD6" dur="6s" begin="2s" keyTimes="0;0.08;0.2" repeatCount="indefinite" />
    </rect>
    <text x="515" y="94" text-anchor="middle" class="box-title">diagramma.json</text>
    <text x="515" y="112" text-anchor="middle" class="box-sub">risposta pulita</text>
  </g>

  <path class="arrow-flow" d="M580 102 H640" marker-end="url(#arrowAI)">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1s" begin="0.5s" repeatCount="indefinite" />
  </path>

  <g>
    <rect x="645" y="66" width="190" height="72" rx="8" fill="#FFFFFF" stroke="#E2DCD6">
      <animate attributeName="stroke" values="#E2DCD6;#F08019;#E2DCD6" dur="6s" begin="3s" keyTimes="0;0.08;0.2" repeatCount="indefinite" />
    </rect>
    <text x="740" y="94" text-anchor="middle" class="box-title">"Apri file" in Vector</text>
    <text x="740" y="112" text-anchor="middle" class="box-sub">modifica a mano o rifinisci</text>
  </g>

  <!-- Lane 2: MCP -->
  <text x="20" y="184" class="lane-label">Oppure via MCP, sul diagramma aperto</text>

  <g>
    <rect x="20" y="196" width="150" height="62" rx="8" fill="#FFFFFF" stroke="#E2DCD6" />
    <text x="95" y="222" text-anchor="middle" class="box-title">AI con client MCP</text>
    <text x="95" y="240" text-anchor="middle" class="box-sub">Claude · Copilot Studio</text>
  </g>

  <path class="arrow-mcp" d="M170 227 H640" marker-end="url(#arrowMcp)">
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite" />
  </path>

  <g>
    <rect x="645" y="196" width="190" height="62" rx="8" fill="#FFFFFF" stroke="#E2DCD6" />
    <text x="740" y="222" text-anchor="middle" class="box-title">Vector (tunnel MCP)</text>
    <text x="740" y="240" text-anchor="middle" class="box-sub">lettura e modifica del diagramma</text>
  </g>

  <text x="430" y="290" text-anchor="middle" class="box-sub">Schema illustrativo: i primi passi avvengono fuori da Vector, in una chat AI esterna.</text>
</svg>
